<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile | AI Resume Coach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css?v=19" />
</head>
<body data-page="profile">
  <nav class="top-nav">
    <a class="brand" href="./index.html">AI Resume Coach</a>
    <div class="nav-links">
      <a href="./target-career.html">Target Careers</a>
      <a href="./resume-analysis.html">Resume Analysis</a>
      <a href="./job-matching.html">Job Matching</a>
      <a class="disabled" href="#">Notifications</a>
      <a class="active" href="./profile.html">Profile</a>
      <button class="nav-button" onclick="signOut()">Logout</button>
    </div>
  </nav>

  <main class="container">
    <section class="hero">
      <h1>Profile</h1>
      <p>Manage your identity details and default AI provider preference.</p>
    </section>

    <section class="card">
      <div class="two-column-form-grid">
        <div>
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" autocomplete="given-name" />
        </div>

        <div>
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" autocomplete="family-name" />
        </div>
      </div>

      <label for="emailAddress">Email Address</label>
      <input id="emailAddress" type="email" autocomplete="email" readonly aria-readonly="true" />
      <p class="field-help">Your email address is managed by Amazon Cognito and cannot be changed here.</p>

      <label for="preferredProvider">Preferred Provider</label>
      <select id="preferredProvider">
        <option value="openai">OpenAI</option>
        <option value="rule-based">Rule-based</option>
      </select>

      <button id="saveProfileButton">Save Profile</button>

      <div id="profileError" class="error-banner hidden"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script src="./profile.js?v=4"></script>
</body>
</html>
