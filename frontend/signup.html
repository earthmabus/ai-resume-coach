<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Create Account | AI Resume Coach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css?v=26" />
</head>
<body class="auth-page">
  <main class="container auth-container">
    <section class="card auth-card">
      <a class="auth-brand" href="./index.html"><span class="brand-mark">ARC</span><span>AI Resume Coach</span></a><p class="auth-kicker">Start your journey</p><h1>Create your account.</h1><p class="auth-intro">Turn your experience into career momentum.</p>

      <div class="two-column-form-grid">
        <div>
          <label for="signupFirstName">First Name</label>
          <input id="signupFirstName" type="text" autocomplete="given-name" />
        </div>
        <div>
          <label for="signupLastName">Last Name</label>
          <input id="signupLastName" type="text" autocomplete="family-name" />
        </div>
      </div>

      <label for="signupEmail">Email</label>
      <input id="signupEmail" type="email" autocomplete="email" />

      <label for="signupPassword">Password</label>
      <input id="signupPassword" type="password" autocomplete="new-password" />

      <label for="signupPasswordConfirm">Confirm Password</label>
      <input id="signupPasswordConfirm" type="password" autocomplete="new-password" />

      <button id="signupButton" class="primary-button" type="button">Submit</button>

      <div class="auth-actions">
        <button type="button" class="secondary-button" onclick="window.location.href='./login.html'">Back to Sign In</button>
      </div>

      <div id="signupResult" class="result-panel">Create your account.</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script>
  <script src="./config.js?v=2"></script>
  <script src="./auth.js?v=2"></script>
  <script src="./signup.js?v=3"></script>
</body>
</html>
