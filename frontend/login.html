<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login | AI Resume Coach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css?v=26" />
</head>
<body class="auth-page">
  <main class="container auth-container">
    <section class="card auth-card">
      <a class="auth-brand" href="./index.html"><span class="brand-mark">ARC</span><span>AI Resume Coach</span></a><p class="auth-kicker">Welcome back</p>

      <h1>Sign in to keep moving forward.</h1><p class="auth-intro">Continue building a stronger career story.</p>

      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" />

      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" />

      <button id="loginButton" class="primary-button">Sign In</button>

      <div class="auth-button-separator"></div>

      <div class="auth-actions">
        <button type="button" class="secondary-button" onclick="window.location.href='./signup.html'">Create New Account</button>
        <button type="button" class="secondary-button" id="resendVerificationButton">Resend Verification Email</button>
      </div>

      <div id="resendVerificationPanel" class="hidden">
        <input id="resendEmail" type="email" placeholder="Email" />
        <button type="button" id="resendVerificationSubmit" disabled>Send Verification Email</button>
        <p id="resendVerificationResult"></p>
      </div>

      <div id="authError" class="error-banner hidden"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script>
  <script src="./config.js?v=3"></script>
  <script src="./auth.js?v=3"></script>
  <script src="./login.js?v=3"></script>
</body>
</html>
